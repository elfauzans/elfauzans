<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <defs>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset="0.5" stop-color="#7af7ff"/>
      <stop offset="1" stop-color="#00aaff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="2" fill="#00eaff" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1000" height="520" rx="24" fill="#050b14" stroke="#00eaff" stroke-width="2"/>
  <rect x="20" y="20" width="960" height="480" rx="18" fill="none" stroke="#16465b"/>

  <!-- HUD -->
  <text x="55" y="65" fill="#00eaff" font-family="monospace" font-size="18">GHILMAN_FAUZAN // SECURITY PROFILE</text>
  <text x="55" y="92" fill="#7af7ff" font-family="monospace" font-size="12">HOLOGRAPHIC INTERFACE • STATUS: ONLINE</text>
  <text x="760" y="65" fill="#00eaff" font-family="monospace" font-size="13">[ CYBER//01 ]</text>

  <!-- grid -->
  <g stroke="#0b3140" opacity=".7">
    <path d="M55 120H945 M55 160H945 M55 200H945 M55 240H945 M55 280H945 M55 320H945 M55 360H945 M55 400H945 M55 440H945"/>
    <path d="M100 120V460 M160 120V460 M220 120V460 M280 120V460 M340 120V460 M400 120V460 M460 120V460 M520 120V460 M580 120V460 M640 120V460 M700 120V460 M760 120V460 M820 120V460 M880 120V460"/>
  </g>

  <!-- hologram person -->
  <g fill="none" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)" opacity=".88">
    <circle cx="365" cy="190" r="48"/>
    <path d="M330 245 Q365 225 400 245 L430 390 Q365 430 300 390 Z"/>
    <path d="M330 260 L255 335 L285 350"/>
    <path d="M400 260 L475 335 L445 350"/>
    <path d="M330 390 L300 460"/>
    <path d="M400 390 L430 460"/>
    <path d="M345 180 Q365 165 385 180"/>
    <path d="M350 205 Q365 215 380 205"/>
    <path d="M330 290 H400 M320 330 H410 M315 370 H415"/>
  </g>

  <!-- animated scan overlay -->
  <rect x="275" y="135" width="180" height="330" fill="url(#scan)" opacity=".8">
    <animate attributeName="y" values="120;450;120" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsing target -->
  <circle cx="365" cy="300" r="120" fill="none" stroke="#00eaff" opacity=".18">
    <animate attributeName="r" values="90;135;90" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".05;.35;.05" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- right terminal -->
  <g font-family="monospace">
    <text x="570" y="155" fill="#00eaff" font-size="16">IDENTITY</text>
    <text x="570" y="185" fill="#b7faff" font-size="13">NAME      : GHILMAN FAUZAN</text>
    <text x="570" y="210" fill="#b7faff" font-size="13">ROLE      : CYBER SECURITY</text>
    <text x="570" y="235" fill="#b7faff" font-size="13">FOCUS     : WEB / DFIR</text>
    <text x="570" y="260" fill="#b7faff" font-size="13">PLATFORM  : PORTSWIGGER</text>
    <text x="570" y="285" fill="#b7faff" font-size="13">OS        : KALI / LINUX</text>
    <text x="570" y="325" fill="#00eaff" font-size="16">CURRENT OPS</text>
    <text x="570" y="355" fill="#b7faff" font-size="13">[+] OWASP TOP 10</text>
    <text x="570" y="380" fill="#b7faff" font-size="13">[+] BUG HUNTING</text>
    <text x="570" y="405" fill="#b7faff" font-size="13">[+] DFIR LABS</text>
    <text x="570" y="430" fill="#b7faff" font-size="13">[+] SECURE CODING</text>
    <text x="570" y="465" fill="#00eaff" font-size="13">root@ghilman:~$ <tspan>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_
    </tspan></text>
  </g>

  <text x="55" y="485" fill="#2c839c" font-family="monospace" font-size="11">SYSTEM VISUALIZATION // LEARNING IN PUBLIC</text>
</svg>
